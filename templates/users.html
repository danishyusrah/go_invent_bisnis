{{ template "header" . }}

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-primary-100 p-5 md:p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2 rounded-xl bg-gradient-to-br from-primary-100 to-primary-50 text-primary-600">
                    <span class="material-symbols-outlined">person_add</span>
                </div>
                <h3 class="font-heading font-semibold text-slate-900">Tambah Karyawan</h3>
            </div>
            <form action="/users/new" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" name="password" required minlength="6" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                    <select name="role" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-medium rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined">person_add</span> Tambah
                </button>
            </form>
        </div>
    </div>

    <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm border border-primary-100 overflow-hidden">
            <div class="px-5 md:px-6 py-4 border-b border-primary-100">
                <h3 class="font-heading font-semibold text-slate-900">Daftar Karyawan</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-5 md:px-6 py-4 font-semibold">Username</th>
                            <th class="px-5 md:px-6 py-4 font-semibold">Role</th>
                            <th class="px-5 md:px-6 py-4 font-semibold text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        {{ range .Users }}
                        <tr class="hover:bg-primary-50/50 transition-colors">
                            <td class="px-5 md:px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold text-sm">
                                        {{ slice .Username 0 1 }}
                                    </div>
                                    <span class="font-medium text-slate-900">{{ .Username }}</span>
                                </div>
                            </td>
                            <td class="px-5 md:px-6 py-4">
                                {{ if eq .Role "admin" }}
                                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-semibold bg-primary-100 text-primary-700">
                                    <span class="material-symbols-outlined text-sm">shield</span> Admin
                                </span>
                                {{ else }}
                                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600">
                                    <span class="material-symbols-outlined text-sm">person</span> Staff
                                </span>
                                {{ end }}
                            </td>
                            <td class="px-5 md:px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-1.5">
                                    <form action="/users/reset/{{ .ID }}" method="POST" class="inline" onsubmit="return confirm('Reset password {{ .Username }}?')">
                                        <button type="submit" class="px-3 py-1.5 text-xs font-medium text-yellow-600 bg-yellow-50 hover:bg-yellow-100 rounded-lg transition-all cursor-pointer">Reset</button>
                                    </form>
                                    <form action="/users/delete/{{ .ID }}" method="POST" class="inline" onsubmit="return confirm('Hapus {{ .Username }}?')">
                                        <button type="submit" class="px-3 py-1.5 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-all cursor-pointer">Hapus</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{{ template "footer" . }}
