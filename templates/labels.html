{{ template "header" . }}

<div class="bg-white rounded-2xl shadow-sm border border-primary-100 p-5 md:p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="font-heading text-lg font-semibold text-slate-900">Cetak Label QR Code</h3>
            <p class="text-sm text-slate-500">{{ len .Products }} produk terbaru</p>
        </div>
        <button onclick="window.print()" class="px-5 py-2.5 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-medium rounded-xl transition-all shadow-lg flex items-center gap-2 cursor-pointer">
            <span class="material-symbols-outlined text-lg">print</span> Cetak
        </button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        {{ range .Products }}
        <div class="border border-slate-200 rounded-xl p-4 text-center bg-slate-50">
            <img src="/product/qrcode/{{ .ID }}" alt="QR {{ .PartNumber }}" class="w-32 h-32 mx-auto mb-3">
            <p class="font-medium text-sm text-slate-900">{{ .PartNumber }}</p>
            <p class="text-xs text-slate-500 mt-1 truncate">{{ .Description }}</p>
        </div>
        {{ end }}
    </div>
</div>

<style media="print">
    body * { visibility: hidden; }
    .grid, .grid * { visibility: visible; }
    .grid { position: absolute; left: 0; top: 0; width: 100%; }
    header, nav, button, .flex.justify-between { display: none !important; }
</style>

{{ template "footer" . }}
