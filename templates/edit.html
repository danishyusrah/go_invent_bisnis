{{ template "header" . }}

<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-primary-100 p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-2.5 rounded-xl bg-gradient-to-br from-yellow-100 to-yellow-50 text-yellow-600">
                <span class="material-symbols-outlined text-2xl">edit</span>
            </div>
            <div>
                <h3 class="font-heading text-lg font-semibold text-slate-900">Edit Produk</h3>
                <p class="text-sm text-slate-500">{{ .Product.PartNumber }}</p>
            </div>
        </div>

        <form action="/product/edit/{{ .Product.ID }}" method="POST" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Part Number <span class="text-red-500">*</span></label>
                    <input type="text" name="part_number" value="{{ .Product.PartNumber }}" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kategori</label>
                    <select name="category" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                        {{ range .Categories }}
                        <option value="{{ .Name }}" {{ if eq .Name $.Product.Category }}selected{{ end }}>{{ .Name }}</option>
                        {{ end }}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Deskripsi</label>
                    <textarea name="description" rows="2" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">{{ .Product.Description }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Min. Level Stok</label>
                    <input type="number" name="min_stock_level" value="{{ .Product.MinStockLevel }}" min="0" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div class="flex items-center">
                    <div class="px-4 py-2.5 bg-slate-100 rounded-xl text-sm text-slate-600 w-full">Stok: <strong class="text-slate-900">{{ .Product.Quantity }}</strong></div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Harga Modal (Rp)</label>
                    <input type="text" name="capital_price" value="{{ printf "%.0f" .Product.CapitalPrice }}" class="rupiah-input w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Harga Jual (Rp)</label>
                    <input type="text" name="selling_price" value="{{ printf "%.0f" .Product.SellingPrice }}" class="rupiah-input w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Lokasi</label>
                    <input type="text" name="location" value="{{ .Product.Location }}" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            <div class="flex items-center gap-3 pt-4 border-t border-slate-100">
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white font-medium rounded-xl transition-all shadow-lg flex items-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined text-lg">save</span>
                    Update
                </button>
                <a href="/inventory" class="px-6 py-2.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl transition-all text-center cursor-pointer">Batal</a>
            </div>
        </form>
    </div>
</div>

{{ template "footer" . }}
