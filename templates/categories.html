{{ template "header" . }}

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-primary-100 p-5 md:p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2 rounded-xl bg-gradient-to-br from-primary-100 to-primary-50 text-primary-600">
                    <span class="material-symbols-outlined">category</span>
                </div>
                <h3 class="font-heading font-semibold text-slate-900">Tambah Kategori</h3>
            </div>
            <form action="/categories/new" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Kategori</label>
                    <input type="text" name="name" required placeholder="cth: Speaker Bluetooth" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-medium rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined">add</span> Tambah Kategori
                </button>
            </form>
        </div>
    </div>

    <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm border border-primary-100 overflow-hidden">
            <div class="px-5 md:px-6 py-4 border-b border-primary-100">
                <h3 class="font-heading font-semibold text-slate-900">Daftar Kategori</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-5 md:px-6 py-4 font-semibold">Nama Kategori</th>
                            <th class="px-5 md:px-6 py-4 font-semibold text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        {{ range .Categories }}
                        <tr class="hover:bg-primary-50/50 transition-colors">
                            <td class="px-5 md:px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <span class="p-2 rounded-lg bg-gradient-to-br from-primary-100 to-primary-50 text-primary-600">
                                        <span class="material-symbols-outlined text-lg">folder</span>
                                    </span>
                                    <span class="font-medium text-slate-900">{{ .Name }}</span>
                                </div>
                            </td>
                            <td class="px-5 md:px-6 py-4 text-right">
                                {{ if ne .Name "Uncategorized" }}
                                <form action="/categories/delete/{{ .ID }}" method="POST" class="inline" onsubmit="return confirm('Hapus {{ .Name }}?')">
                                    <button type="submit" class="px-3 py-1.5 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-all cursor-pointer">
                                        <span class="material-symbols-outlined text-sm">delete</span> Hapus
                                    </button>
                                </form>
                                {{ end }}
                            </td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{{ template "footer" . }}
