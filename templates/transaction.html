{{ template "header" . }}

<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-primary-100 p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-2.5 rounded-xl bg-gradient-to-br from-blue-100 to-blue-50 text-blue-600">
                <span class="material-symbols-outlined text-2xl">swap_horiz</span>
            </div>
            <div>
                <h3 class="font-heading text-lg font-semibold text-slate-900">Transaksi Stok</h3>
                <p class="text-sm text-slate-500">{{ .Product.PartNumber }} — {{ .Product.Description }}</p>
            </div>
        </div>

        <div class="bg-gradient-to-r from-primary-50 to-primary-100 rounded-xl p-5 mb-6 border border-primary-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-primary-700 font-medium">Stok Saat Ini</p>
                    <p class="font-heading text-3xl font-bold text-primary-700 mt-1">{{ .Product.Quantity }}</p>
                </div>
                <div class="p-3 bg-white/60 rounded-xl text-primary-600">
                    <span class="material-symbols-outlined text-3xl">inventory</span>
                </div>
            </div>
        </div>

        <form action="/product/{{ .Product.ID }}/transaction" method="POST" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tipe</label>
                    <div class="flex gap-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="transaction_type" value="IN" checked class="peer hidden">
                            <div class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-slate-200 rounded-xl peer-checked:border-emerald-500 peer-checked:bg-emerald-50 bg-slate-50 transition-all">
                                <span class="material-symbols-outlined text-emerald-600">add_circle</span>
                                <span class="text-sm font-medium text-slate-700">IN</span>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="transaction_type" value="OUT" class="peer hidden">
                            <div class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-slate-200 rounded-xl peer-checked:border-red-500 peer-checked:bg-red-50 bg-slate-50 transition-all">
                                <span class="material-symbols-outlined text-red-500">remove_circle</span>
                                <span class="text-sm font-medium text-slate-700">OUT</span>
                            </div>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kuantitas</label>
                    <input type="number" name="quantity" required min="1" class="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Catatan</label>
                <textarea name="notes" rows="2" placeholder="cth: Restock dari supplier" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
            </div>
            <div class="flex items-center gap-3 pt-4 border-t border-slate-100">
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-medium rounded-xl transition-all shadow-lg flex items-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined text-lg">swap_horiz</span>
                    Proses
                </button>
                <a href="/inventory" class="px-6 py-2.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl transition-all cursor-pointer">Batal</a>
            </div>
        </form>
    </div>
</div>

{{ template "footer" . }}
